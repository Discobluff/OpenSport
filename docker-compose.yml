version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: opensport-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: opensport
    volumes:
      - mongodb_data:/data/db
    networks:
      - opensport-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: opensport-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/opensport?authSource=admin
      DB_NAME: opensport
      JWT_SECRET: your-very-secure-jwt-secret-key-change-in-production
      PORT: 8080
    depends_on:
      - mongodb
    networks:
      - opensport-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: opensport-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - opensport-network

volumes:
  mongodb_data:

networks:
  opensport-network:
    driver: bridge